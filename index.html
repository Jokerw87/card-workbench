<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>可编辑卡片工作台 V1</title><link rel="stylesheet" href="shared.css"><script defer src="cards.js"></script></head><body><header><div><h1>可编辑卡片工作台</h1><p>选模板 · 编辑文字 · 预览并导出 PNG</p></div><a href="index.html">工具入口</a></header><main class="layout"><aside><h2>内容</h2><label for="template">模板</label><select id="template"></select><div id="fields"></div><h2>排版</h2><label for="ratio">画布比例</label><select id="ratio"><option value="1440">3:4 · 1080 × 1440</option><option value="1920">9:16 · 1080 × 1920</option><option value="auto">长内容 · 自动高度（最高6000）</option></select><div class="row"><div><label for="titleSize">标题字号</label><input id="titleSize" type="number" min="32" max="100" value="64"></div><div><label for="bodySize">正文字号</label><input id="bodySize" type="number" min="22" max="60" value="34"></div></div><label for="lineHeight">行距倍数（1.15—2.2）</label><input id="lineHeight" type="number" step=".05" min="1.15" max="2.2" value="1.55"><div class="row"><div><label for="background">背景色</label><input type="color" id="background" value="#ffffff"></div><div><label for="ink">文字色</label><input type="color" id="ink" value="#183e53"></div><div><label for="accent">强调色</label><input type="color" id="accent" value="#177da2"></div></div><div class="actions"><button id="clear">清空文字</button><button id="reset">重置示例</button></div><div class="actions"><button id="save">保存可编辑稿</button><button id="load">打开可编辑稿</button></div><input id="draftFile" type="file" accept=".json,application/json" hidden><p class="hint">编辑稿仅在你选择保存时下载到本机，不自动存储。切换模板、清空及离开时会提示未保存内容。只用系统字体，不包含 Logo 或字体文件。</p></aside><section class="panel"><div class="toolbar"><h2>成图预览</h2><span id="dimensions" class="badge"></span><button id="export" class="primary">导出 PNG</button></div><p id="status" class="notice" role="status" aria-live="polite"></p><div class="canvaswrap"><canvas id="preview" aria-label="卡片实时预览"></canvas></div><p class="hint">图片与此画布使用同一组像素。溢出时停止导出，请减小字号、精简文字或改用自动高度。示例均为虚构，联系方式不含真实号码。</p></section></main></body></html>
